Ahora pega esto en el cuadro grande:

```yaml
name: Publicar en Instagram

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar ahora mismo (si/no)"
        default: "si"

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python publicar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar }}
```

Esto despierta al bot cada hora, y el código solo publica si es una de tus cinco horas. También te deja publicar a mano para probar. Luego dale a "Commit changes" dos veces.
